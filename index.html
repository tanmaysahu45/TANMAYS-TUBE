<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TANMAYS TUBE</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet" />

  <!-- Firebase (Safe Load) -->
  <script type="module">
    try {
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
      import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
      
      const firebaseConfig = {
        apiKey: "AIzaSyC0oqld16EcbNUkYm3rOFLuId1iDFoLGJo",
        authDomain: "studio-1376926805-1d7be.firebaseapp.com",
        projectId: "studio-1376926805-1d7be",
        storageBucket: "studio-1376926805-1d7be.firebasestorage.app",
        messagingSenderId: "467327670494",
        appId: "1:467327670494:web:79dd0bfe3104aff22f8a4f"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const provider = new GoogleAuthProvider();
      window.FirebaseBridge = { auth, provider, signInWithPopup };
    } catch (e) {
      console.log("Firebase load delayed, app will still run.");
    }
  </script>

  <style>
    :root {
      --bg-dark: #0f0f0f;
      --surface-dark: #212121;
      --accent-cyan: #00f2fe;
      --text-main: #ffffff;
      --text-sub: #aaaaaa;
      --header-height: 60px;
      --bottom-nav-height: 60px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body { background-color: var(--bg-dark); color: var(--text-main); height: 100dvh; width: 100vw; overflow: hidden; display: flex; flex-direction: column; }

    /* HEADER */
    header { height: var(--header-height); background: var(--bg-dark); display: flex; align-items: center; padding: 0 12px; gap: 10px; z-index: 100; border-bottom: 1px solid #333; }
    .brand-logo { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 900; color: var(--accent-cyan); display: none; }
    @media(min-width: 400px) { .brand-logo { display: block; } }

    /* BIG SEARCH BAR + MIC */
    .search-container { flex: 1; display: flex; align-items: center; background: var(--surface-dark); border-radius: 25px; padding: 5px 15px; border: 1px solid #333; }
    .search-box { flex: 1; background: transparent; border: none; color: white; padding: 8px 5px; font-size: 0.95rem; outline: none; }
    .search-btn, .mic-btn { background: none; border: none; color: var(--text-main); font-size: 1.1rem; padding: 5px; cursor: pointer; }
    .mic-btn { margin-left: 8px; border-left: 1px solid #444; padding-left: 12px; }
    
    .header-icons { display: flex; gap: 12px; }
    .icon-btn { background: none; border: none; color: white; font-size: 1.3rem; cursor: pointer; }

    /* MAIN VIEWS */
    main { flex: 1; height: calc(100dvh - var(--header-height) - var(--bottom-nav-height)); overflow-y: auto; position: relative; }
    .view-section { display: none; height: 100%; overflow-y: auto; }
    .view-section.active { display: block; }

    /* HOME FEED */
    .grid-feed { padding: 10px; display: grid; gap: 15px; grid-template-columns: repeat(auto-fill, minmax(100%, 1fr)); }
    @media(min-width: 600px) { .grid-feed { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); } }
    
    .media-card { cursor: pointer; }
    .thumbnail-box { width: 100%; aspect-ratio: 16/9; background: #222; border-radius: 12px; overflow: hidden; position: relative; }
    .thumbnail-box img { width: 100%; height: 100%; object-fit: cover; }
    .media-details { padding: 10px 5px; display: flex; gap: 12px; }
    .channel-pic { width: 40px; height: 40px; border-radius: 50%; background: #444; }
    .media-info { flex: 1; }
    .media-title { font-size: 0.95rem; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 4px; }
    .media-meta { font-size: 0.8rem; color: var(--text-sub); }

    /* YOUTUBE STYLE PLAYER PAGE */
    #tab-player { background: var(--bg-dark); z-index: 50; position: absolute; top: 0; left: 0; width: 100%; }
    .player-video-container { width: 100%; aspect-ratio: 16/9; background: #000; position: sticky; top: 0; z-index: 10; }
    .player-video-container iframe { width: 100%; height: 100%; border: none; }
    .player-details { padding: 15px; }
    .player-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 5px; }
    .player-views { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 15px; }
    
    .player-channel-bar { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #333; border-bottom: 1px solid #333; padding: 10px 0; margin-bottom: 15px; }
    .channel-left { display: flex; align-items: center; gap: 10px; }
    .channel-name { font-weight: 600; font-size: 1rem; }
    .subscribe-btn { background: var(--text-main); color: var(--bg-dark); border: none; padding: 8px 16px; border-radius: 20px; font-weight: 600; cursor: pointer; }
    
    .player-actions { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
    .action-pill { background: var(--surface-dark); border: none; color: white; padding: 8px 15px; border-radius: 20px; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; white-space: nowrap; }

    /* REELS */
    .reels-container { height: 100%; scroll-snap-type: y mandatory; overflow-y: scroll; background: #000; }
    .reel-card { height: 100%; width: 100%; scroll-snap-align: start; position: relative; display: flex; justify-content: center; align-items: center; }
    .reel-card iframe { width: 100%; height: 100%; border: none; pointer-events: none; }
    
    /* BOTTOM NAV */
    .bottom-bar { height: var(--bottom-nav-height); background: var(--bg-dark); border-top: 1px solid #333; display: flex; justify-content: space-around; align-items: center; position: fixed; bottom: 0; width: 100%; z-index: 100; }
    .nav-tab { background: none; border: none; color: var(--text-sub); display: flex; flex-direction: column; align-items: center; font-size: 0.7rem; gap: 4px; cursor: pointer; }
    .nav-tab i { font-size: 1.4rem; }
    .nav-tab.active { color: var(--text-main); }
    .create-btn i { font-size: 2rem; }

    /* AI CHAT FLOATING */
    .ai-fab { position: fixed; bottom: 80px; right: 15px; width: 55px; height: 55px; border-radius: 50%; background: var(--accent-cyan); color: #000; display: flex; justify-content: center; align-items: center; font-size: 1.8rem; box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4); z-index: 150; cursor: pointer; }
    .ai-chat-window { position: fixed; bottom: -100%; left: 0; width: 100%; height: 70dvh; background: var(--surface-dark); border-top-left-radius: 20px; border-top-right-radius: 20px; z-index: 200; transition: 0.3s; display: flex; flex-direction: column; box-shadow: 0 -5px 20px rgba(0,0,0,0.8); }
    .ai-chat-window.open { bottom: 0; }
    .ai-header { padding: 15px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
    .ai-body { flex: 1; padding: 15px; overflow-y: auto; font-size: 0.95rem; line-height: 1.5; }
    .ai-footer { padding: 10px 15px; display: flex; gap: 10px; background: var(--bg-dark); }
    .ai-input { flex: 1; padding: 12px 15px; border-radius: 25px; border: none; background: #333; color: white; outline: none; }
    .ai-send { background: none; border: none; color: var(--accent-cyan); font-size: 1.5rem; padding: 0 10px; }

  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="brand-logo">TANMAYS</div>
    <div class="search-container">
      <input type="text" id="searchInput" class="search-box" placeholder="Search YouTube..." />
      <button class="search-btn" id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i></button>
      <button class="mic-btn" onclick="alert('Mic activated!')"><i class="fa-solid fa-microphone"></i></button>
    </div>
    <div class="header-icons">
      <button class="icon-btn" onclick="toggleMenu()"><i class="fa-solid fa-ellipsis-vertical"></i></button>
    </div>
  </header>

  <main>
    <!-- HOME FEED -->
    <section id="tab-home" class="view-section active">
      <div class="grid-feed" id="homeFeed"></div>
    </section>

    <!-- YOUTUBE PLAYER PAGE -->
    <section id="tab-player" class="view-section">
      <div class="player-video-container">
        <iframe id="mainPlayer" src="" allow="autoplay; fullscreen"></iframe>
      </div>
      <div class="player-details">
        <h1 class="player-title" id="pTitle">Video Title</h1>
        <p class="player-views" id="pViews">1.2M views • 2 days ago</p>
        
        <div class="player-actions">
          <button class="action-pill"><i class="fa-regular fa-thumbs-up"></i> 124K</button>
          <button class="action-pill"><i class="fa-solid fa-share"></i> Share</button>
          <button class="action-pill"><i class="fa-solid fa-download"></i> Download</button>
          <button class="action-pill"><i class="fa-regular fa-bookmark"></i> Save</button>
        </div>

        <div class="player-channel-bar">
          <div class="channel-left">
            <div class="channel-pic"></div>
            <div>
              <div class="channel-name" id="pChannel">Channel Name</div>
              <div style="font-size: 0.8rem; color: var(--text-sub);">2.5M subscribers</div>
            </div>
          </div>
          <button class="subscribe-btn">Subscribe</button>
        </div>
      </div>
    </section>

    <!-- REELS FEED -->
    <section id="tab-reels" class="view-section">
      <div class="reels-container" id="reelsFeed"></div>
    </section>
  </main>

  <!-- AI FAB & CHAT -->
  <div class="ai-fab" onclick="toggleAI()"><i class="fa-solid fa-robot"></i></div>
  <div class="ai-chat-window" id="aiWindow">
    <div class="ai-header">
      <strong>✨ Tanmays Intelligence</strong>
      <i class="fa-solid fa-chevron-down" onclick="toggleAI()" style="font-size: 1.5rem;"></i>
    </div>
    <div class="ai-body" id="aiResponse">Hello Tanmay! Ask me anything...</div>
    <div class="ai-footer">
      <input type="text" id="aiInput" class="ai-input" placeholder="Type a message...">
      <button class="ai-send" onclick="askGemini()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-bar">
    <button class="nav-tab active" onclick="switchTab('tab-home', this)"><i class="fa-solid fa-house"></i>Home</button>
    <button class="nav-tab" onclick="switchTab('tab-reels', this)"><i class="fa-solid fa-clapperboard"></i>Reels</button>
    <button class="nav-tab create-btn" onclick="alert('Upload Video')"><i class="fa-regular fa-square-plus"></i></button>
    <button class="nav-tab" onclick="alert('Profile Loading...')"><i class="fa-regular fa-user"></i>Profile</button>
  </nav>

  <script>
    const YT_API = "AIzaSyBmBxgSoangpIJOuisVqRNrMj1nP5UFiWQ";
    const GEMINI_API = "AQ.Ab8RN6LQ-JCPDbo96b749XRuedHg2mUycAlKeXxxY5bSrN0mCA";
    
    const mockVideos = [
      { id: "jfKfPfyJRdk", title: "Lofi Beats to Relax/Study", creator: "Lofi Girl", views: "2.4M views", thumb: "https://i.ytimg.com/vi/jfKfPfyJRdk/hqdefault.jpg" },
      { id: "kJQP7kiw5Fk", title: "Cyberpunk Night Drive", creator: "Neon Vibes", views: "850K views", thumb: "https://i.ytimg.com/vi/kJQP7kiw5Fk/hqdefault.jpg" },
      { id: "3JZ_D3ELwOQ", title: "Web Development 2026", creator: "Tanmay Studio", views: "1.1M views", thumb: "https://i.ytimg.com/vi/3JZ_D3ELwOQ/hqdefault.jpg" }
    ];

    const shortsData = ["7m16dFI1AF8", "YqH4eWPNu-8", "5qap5aO4i9A"]; // Reliable YT Shorts IDs

    window.onload = () => {
      loadHomeFeed(mockVideos);
      loadReels();
      setupSearch();
    };

    function switchTab(targetId, btn) {
      document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
      document.getElementById(targetId).classList.add('active');
      if(btn) btn.classList.add('active');
      
      // Stop video if leaving player
      if(targetId !== 'tab-player') document.getElementById('mainPlayer').src = "";
    }

    function loadHomeFeed(data) {
      const feed = document.getElementById("homeFeed");
      feed.innerHTML = data.map(v => `
        <div class="media-card" onclick="openPlayer('${v.id}', '${v.title.replace(/'/g, "")}', '${v.creator}', '${v.views}')">
          <div class="thumbnail-box"><img src="${v.thumb}"></div>
          <div class="media-details">
            <div class="channel-pic"></div>
            <div class="media-info">
              <div class="media-title">${v.title}</div>
              <div class="media-meta">${v.creator} • ${v.views}</div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function openPlayer(id, title, creator, views) {
      document.getElementById('pTitle').innerText = title;
      document.getElementById('pChannel').innerText = creator;
      document.getElementById('pViews').innerText = views || "Trending now";
      
      switchTab('tab-player');
      document.getElementById('mainPlayer').src = `https://www.youtube.com/embed/${id}?autoplay=1`;
    }

    function loadReels() {
      const container = document.getElementById("reelsFeed");
      container.innerHTML = shortsData.map(id => `
        <div class="reel-card">
          <iframe src="https://www.youtube.com/embed/${id}?autoplay=1&mute=1&loop=1&playlist=${id}&controls=0&modestbranding=1" allow="autoplay; fullscreen"></iframe>
        </div>
      `).join('');
    }

    function setupSearch() {
      const input = document.getElementById('searchInput');
      const doSearch = async () => {
        if(!input.value.trim()) return;
        switchTab('tab-home', document.querySelector('.nav-tab'));
        document.getElementById("homeFeed").innerHTML = "<p style='padding:20px'>Searching...</p>";
        try {
          const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=10&q=${encodeURIComponent(input.value)}&type=video&key=${YT_API}`);
          const data = await res.json();
          const mapped = data.items.map(i => ({
            id: i.id.videoId, title: i.snippet.title, creator: i.snippet.channelTitle, views: "New", thumb: i.snippet.thumbnails.high.url
          }));
          loadHomeFeed(mapped);
        } catch(e) {
          loadHomeFeed(mockVideos);
        }
      };
      document.getElementById('searchBtn').onclick = doSearch;
      input.onkeypress = (e) => { if(e.key === "Enter") doSearch(); };
    }

    function toggleAI() {
      document.getElementById('aiWindow').classList.toggle('open');
    }

    async function askGemini() {
      const input = document.getElementById('aiInput');
      const box = document.getElementById('aiResponse');
      if(!input.value) return;
      
      const q = input.value;
      input.value = "";
      box.innerHTML = `<div style="margin-bottom:10px"><strong>You:</strong> ${q}</div><div><i class="fa-solid fa-spinner fa-spin"></i> Typing...</div>`;
      
      try {
        // Updated to 1.5-flash for reliability
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API}`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: q }] }] })
        });
        const data = await res.json();
        const reply = data.candidates[0].content.parts[0].text;
        box.innerHTML = `<div style="margin-bottom:10px"><strong>You:</strong> ${q}</div><div><strong>AI:</strong> ${reply}</div>`;
      } catch(e) {
        box.innerHTML = "Error connecting to AI. Please try again.";
      }
    }
  </script>
</body>
</html>
